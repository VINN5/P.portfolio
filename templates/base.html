<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101C2C">
    <title>{% block title %}Vinn Wambui | Portfolio{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        /* ============================================
           MIDNIGHT INTELLIGENCE - DESIGN TOKENS
           Change the palette here and nowhere else.
           ============================================ */
        :root {
            /* Brand palette */
            --midnight-navy: #101C2C;
            --egyptian-blue: #245A9B;
            --stone-blue:    #8BA9C5;
            --soft-ivory:    #F1F0EA;
            --scarlet-red:   #E64B4B;

            /* Derived dark surfaces (tints/shades of Midnight Navy) */
            --navy-deep:     #0B1521;
            --surface:       #16263B;
            --surface-hover: #1B3050;
            --band:          rgba(139, 169, 197, 0.05);

            /* Egyptian Blue interaction shades */
            --egyptian-hover:  #2C6BB3;
            --egyptian-active: #1D4C84;

            /* Semantic roles - components should use these */
            --bg:           var(--midnight-navy);
            --text:         var(--soft-ivory);
            --text-muted:   var(--stone-blue);
            --brand:        var(--egyptian-blue);
            --accent:       var(--scarlet-red);
            --border:       rgba(139, 169, 197, 0.22);
            --border-strong: rgba(139, 169, 197, 0.45);
            --shadow-soft:  0 12px 32px rgba(4, 10, 20, 0.35);
            --shadow-lift:  0 20px 44px rgba(4, 10, 20, 0.5);

            color-scheme: dark;
        }

        /* Map the tokens onto Bootstrap's own variables */
        :root[data-bs-theme="dark"] {
            --bs-body-bg: var(--midnight-navy);
            --bs-body-bg-rgb: 16, 28, 44;
            --bs-body-color: var(--soft-ivory);
            --bs-body-color-rgb: 241, 240, 234;
            --bs-emphasis-color: var(--soft-ivory);
            --bs-heading-color: var(--soft-ivory);
            --bs-secondary-color: var(--stone-blue);
            --bs-secondary-color-rgb: 139, 169, 197;
            --bs-border-color: rgba(139, 169, 197, 0.22);
            --bs-link-color: var(--stone-blue);
            --bs-link-color-rgb: 139, 169, 197;
            --bs-link-hover-color: var(--soft-ivory);
            --bs-link-hover-color-rgb: 241, 240, 234;
            --bs-primary: var(--egyptian-blue);
            --bs-primary-rgb: 36, 90, 155;
        }

        ::selection {
            background: var(--egyptian-blue);
            color: var(--soft-ivory);
        }

        /* Accessible focus state for every interactive element */
        :focus-visible {
            outline: 2px solid var(--scarlet-red);
            outline-offset: 3px;
        }

        .btn:focus-visible,
        .navbar-toggler:focus-visible {
            outline: 2px solid var(--scarlet-red);
            outline-offset: 3px;
            box-shadow: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            background: linear-gradient(180deg, var(--midnight-navy) 0%, #0E1826 100%);
            color: var(--text);
            overflow-x: hidden;
        }

        /* Shared overrides so Bootstrap helpers behave on the dark theme */
        .bg-light {
            background-color: var(--band) !important;
        }

        .card {
            --bs-card-bg: var(--surface);
            --bs-card-color: var(--text);
            --bs-card-border-color: var(--border);
        }

        hr {
            border-color: var(--border);
            opacity: 1;
        }

        /* Page entrance animation */
        main {
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: none;
            }
        }

        /* Navbar */
        .navbar {
            background-color: transparent;
            transition: all 0.4s ease;
        }

        .navbar.scrolled {
            background-color: rgba(16, 28, 44, 0.92);
            backdrop-filter: blur(12px);
            box-shadow: 0 1px 0 var(--border), 0 8px 24px rgba(4, 10, 20, 0.35);
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--soft-ivory) !important;
        }

        .nav-link {
            position: relative;
            font-weight: 500;
            color: var(--stone-blue) !important;
            transition: color 0.2s ease;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--soft-ivory) !important;
        }

        /* Scarlet active indicator */
        .nav-link.active::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 2px;
            width: 20px;
            height: 2px;
            border-radius: 2px;
            background: var(--scarlet-red);
            transform: translateX(-50%);
        }

        .navbar-toggler {
            border-color: var(--border-strong);
        }

        .navbar-toggler:focus {
            box-shadow: none;
        }

        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='%23F1F0EA' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        }

        /* Hero */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top right, rgba(36, 90, 155, 0.22), transparent 50%);
            pointer-events: none;
        }

        .dotted-circle {
            position: absolute;
            top: 50%;
            right: 5%;
            transform: translateY(-50%);
            width: 560px;
            height: 560px;
            border: 2px dotted var(--stone-blue);
            border-radius: 50%;
            opacity: 0.3;
            pointer-events: none;
        }

        .profile-img {
            width: 420px;
            height: 420px;
            max-width: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 10px solid var(--surface);
            box-shadow: 0 0 0 1px var(--border-strong), 0 30px 70px rgba(4, 10, 20, 0.55);
        }

        .gradient-text {
            background: linear-gradient(135deg, var(--stone-blue), var(--soft-ivory));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
        }

        h1.display-3 {
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .lead {
            font-size: 1.25rem;
            font-weight: 400;
            color: var(--stone-blue);
        }

        /* Buttons */
        .btn-primary {
            --bs-btn-color: var(--soft-ivory);
            --bs-btn-bg: var(--egyptian-blue);
            --bs-btn-border-color: var(--egyptian-blue);
            --bs-btn-hover-color: var(--soft-ivory);
            --bs-btn-hover-bg: var(--egyptian-hover);
            --bs-btn-hover-border-color: var(--egyptian-hover);
            --bs-btn-active-color: var(--soft-ivory);
            --bs-btn-active-bg: var(--egyptian-active);
            --bs-btn-active-border-color: var(--egyptian-active);
            --bs-btn-border-width: 0px;
            border-radius: 50px;
            padding: 14px 32px;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .btn-outline-primary {
            --bs-btn-color: var(--stone-blue);
            --bs-btn-border-color: var(--stone-blue);
            --bs-btn-hover-color: var(--midnight-navy);
            --bs-btn-hover-bg: var(--stone-blue);
            --bs-btn-hover-border-color: var(--stone-blue);
            --bs-btn-active-color: var(--midnight-navy);
            --bs-btn-active-bg: var(--soft-ivory);
            --bs-btn-active-border-color: var(--soft-ivory);
            border-radius: 50px;
            padding: 14px 32px;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .btn-outline-primary:hover {
            transform: translateY(-2px);
        }

        /* Secondary outline used on project cards (was btn-outline-dark) */
        .btn-outline-dark {
            --bs-btn-color: var(--soft-ivory);
            --bs-btn-border-color: var(--border-strong);
            --bs-btn-hover-color: var(--midnight-navy);
            --bs-btn-hover-bg: var(--soft-ivory);
            --bs-btn-hover-border-color: var(--soft-ivory);
            --bs-btn-active-color: var(--midnight-navy);
            --bs-btn-active-bg: var(--soft-ivory);
            --bs-btn-active-border-color: var(--soft-ivory);
        }

        .btn-resume {
            background-color: transparent;
            border: 2px solid var(--border-strong);
            color: var(--soft-ivory);
            border-radius: 50px;
            padding: 14px 32px;
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .btn-resume:hover {
            background-color: var(--soft-ivory);
            border-color: var(--soft-ivory);
            color: var(--midnight-navy);
            transform: translateY(-2px);
        }

        /* Scarlet CTA - reserve for ONE key action per page */
        .btn-accent {
            --bs-btn-color: var(--midnight-navy);
            --bs-btn-bg: var(--scarlet-red);
            --bs-btn-border-color: var(--scarlet-red);
            --bs-btn-hover-color: var(--midnight-navy);
            --bs-btn-hover-bg: #EE6464;
            --bs-btn-hover-border-color: #EE6464;
            --bs-btn-active-color: var(--midnight-navy);
            --bs-btn-active-bg: #D13F3F;
            --bs-btn-active-border-color: #D13F3F;
            --bs-btn-border-width: 0px;
            border-radius: 50px;
            padding: 14px 32px;
            font-weight: 700;
            transition: all 0.25s ease;
        }

        .btn-accent:hover {
            transform: translateY(-2px);
        }

        .location {
            color: var(--stone-blue);
            font-weight: 500;
            font-size: 1.1rem;
        }

        /* Footer */
        footer {
            background: var(--navy-deep);
            border-top: 1px solid var(--border);
            color: var(--stone-blue);
            padding: 3rem 0 2rem;
            margin-top: 5rem;
        }

        footer .footer-title {
            color: var(--soft-ivory);
        }

        footer a {
            color: var(--stone-blue);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: var(--soft-ivory);
        }

        /* ============================================
           MOBILE RESPONSIVE STYLES
           ============================================ */

        @media (max-width: 991.98px) {
            .navbar {
                background-color: rgba(16, 28, 44, 0.98) !important;
                box-shadow: 0 1px 0 var(--border), 0 4px 14px rgba(4, 10, 20, 0.4);
            }

            .navbar-brand {
                font-size: 1.4rem !important;
            }

            .navbar-nav {
                padding: 1rem 0;
                text-align: center;
            }

            .navbar-nav .nav-link {
                padding: 0.7rem 0;
                font-size: 1.05rem;
            }

            .navbar-nav .nav-link.active::after {
                bottom: 6px;
            }

            .navbar .btn-primary {
                width: 100%;
                margin-top: 1rem;
            }

            .dotted-circle {
                width: 400px;
                height: 400px;
            }

            .profile-img {
                width: 320px;
                height: 320px;
                border: 8px solid var(--surface);
            }
        }

        @media (max-width: 767.98px) {
            .hero {
                min-height: auto;
                padding: 100px 0 40px;
            }

            .dotted-circle {
                width: 280px;
                height: 280px;
                right: -40px;
                opacity: 0.22;
            }

            .profile-img {
                width: 260px;
                height: 260px;
                border: 6px solid var(--surface);
                margin-bottom: 2rem;
            }

            h1.display-3 {
                font-size: 2rem !important;
                line-height: 1.3;
            }

            .lead {
                font-size: 1.1rem;
            }

            .location {
                font-size: 1rem;
            }

            .btn-primary,
            .btn-outline-primary,
            .btn-resume,
            .btn-accent {
                padding: 12px 24px;
                font-size: 0.95rem;
            }
        }

        @media (max-width: 575.98px) {
            .hero {
                padding: 80px 0 30px;
            }

            .profile-img {
                width: 200px;
                height: 200px;
                border: 5px solid var(--surface);
            }

            h1.display-3 {
                font-size: 1.65rem !important;
            }

            .lead {
                font-size: 1rem;
            }

            .dotted-circle {
                width: 220px;
                height: 220px;
                right: -60px;
            }

            .btn-primary,
            .btn-outline-primary,
            .btn-resume,
            .btn-accent {
                padding: 10px 20px;
                font-size: 0.9rem;
            }
        }

        @media (max-width: 400px) {
            .profile-img {
                width: 180px;
                height: 180px;
            }

            h1.display-3 {
                font-size: 1.5rem !important;
            }

            .navbar-brand {
                font-size: 1.3rem !important;
            }
        }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand fs-4" href="/">VW</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/projects' %}active{% endif %}" href="/projects">Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/contact' %}active{% endif %}" href="/contact">Contact</a>
                    </li>
                </ul>
                <a href="/contact" class="btn btn-primary ms-lg-3">Connect</a>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 mb-3 mb-md-0">
                    <p class="mb-1 fw-medium footer-title">Let's build something meaningful.</p>
                    <p class="mb-0 small">© 2026 Vincent Wambugu. All rights reserved.</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <a href="https://github.com/VINN5" target="_blank" class="me-3">
                        <i class="fab fa-github fa-lg"></i>
                    </a>
                    <a href="mailto:vinnwambui2@gmail.com" class="me-3">
                        <i class="fas fa-envelope fa-lg"></i>
                    </a>
                    <a href="https://wa.me/254759270210" target="_blank">
                        <i class="fab fa-whatsapp fa-lg"></i>
                    </a>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.addEventListener('scroll', () => {
            document.querySelector('.navbar').classList.toggle('scrolled', window.scrollY > 50);
        });
    </script>
</body>

</html>
