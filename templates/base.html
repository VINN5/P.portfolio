<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101C2C">
    <meta name="description" content="Vincent Wambugu (VINN) — Software Engineer in Nairobi building AI-powered applications, enterprise systems, and scalable platforms.">
    <title>{% block title %}Vinn Wambui | Software Engineer{% endblock %}</title>

    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        /* ============================================
           MIDNIGHT INTELLIGENCE — DESIGN SYSTEM
           ============================================ */
        :root {
            --midnight-navy: #101C2C;
            --egyptian-blue: #245A9B;
            --stone-blue:    #8BA9C5;
            --soft-ivory:    #F1F0EA;
            --scarlet-red:   #E64B4B;

            --navy-deep:     #0B1521;
            --surface:       #16263B;
            --surface-hover: #1B3050;
            --band:          rgba(139, 169, 197, 0.06);

            --egyptian-hover:  #2C6BB3;
            --egyptian-active: #1D4C84;

            --bg:            var(--midnight-navy);
            --text:          var(--soft-ivory);
            --text-muted:    var(--stone-blue);
            --brand:         var(--egyptian-blue);
            --accent:        var(--scarlet-red);
            --border:        rgba(139, 169, 197, 0.18);
            --border-strong: rgba(139, 169, 197, 0.38);
            --shadow-soft:   0 8px 28px rgba(4, 10, 20, 0.32);
            --shadow-lift:   0 18px 40px rgba(4, 10, 20, 0.48);

            --radius-sm: 10px;
            --radius-md: 16px;
            --radius-lg: 24px;
            --radius-pill: 999px;

            --space-section: clamp(4rem, 8vw, 6.5rem);
            --content-max: 1120px;

            color-scheme: dark;
        }

        :root[data-bs-theme="dark"] {
            --bs-body-bg: var(--midnight-navy);
            --bs-body-bg-rgb: 16, 28, 44;
            --bs-body-color: var(--soft-ivory);
            --bs-body-color-rgb: 241, 240, 234;
            --bs-emphasis-color: var(--soft-ivory);
            --bs-heading-color: var(--soft-ivory);
            --bs-secondary-color: var(--stone-blue);
            --bs-secondary-color-rgb: 139, 169, 197;
            --bs-border-color: var(--border);
            --bs-link-color: var(--stone-blue);
            --bs-link-color-rgb: 139, 169, 197;
            --bs-link-hover-color: var(--soft-ivory);
            --bs-link-hover-color-rgb: 241, 240, 234;
            --bs-primary: var(--egyptian-blue);
            --bs-primary-rgb: 36, 90, 155;
        }

        *, *::before, *::after { box-sizing: border-box; }

        html {
            scroll-behavior: smooth;
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        ::selection {
            background: var(--egyptian-blue);
            color: var(--soft-ivory);
        }

        :focus-visible {
            outline: 2px solid var(--scarlet-red);
            outline-offset: 3px;
        }

        .btn:focus-visible,
        .navbar-toggler:focus-visible {
            outline: 2px solid var(--scarlet-red);
            outline-offset: 3px;
            box-shadow: none;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            background-image: linear-gradient(180deg, var(--midnight-navy) 0%, #0E1826 100%);
            background-attachment: fixed;
            color: var(--text);
            overflow-x: hidden;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .bg-light {
            background-color: var(--band) !important;
        }

        .card {
            --bs-card-bg: var(--surface);
            --bs-card-color: var(--text);
            --bs-card-border-color: var(--border);
        }

        hr {
            border-color: var(--border);
            opacity: 1;
        }

        .text-muted {
            color: var(--stone-blue) !important;
        }

        main {
            animation: fadeIn 0.55s ease both;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: none; }
        }

        /* ---------- NAVBAR ---------- */
        .navbar {
            background-color: transparent;
            transition: background-color 0.35s ease, box-shadow 0.35s ease, backdrop-filter 0.35s ease;
            padding-top: 1rem;
            padding-bottom: 1rem;
        }

        .navbar.scrolled {
            background-color: rgba(11, 21, 33, 0.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 1px 0 var(--border), 0 6px 20px rgba(4, 10, 20, 0.35);
            padding-top: 0.7rem;
            padding-bottom: 0.7rem;
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: -0.4px;
            color: var(--soft-ivory) !important;
            font-size: 1.25rem;
        }

        .navbar-brand span {
            color: var(--stone-blue);
            font-weight: 500;
        }

        .nav-link {
            position: relative;
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--stone-blue) !important;
            padding: 0.5rem 0.9rem !important;
            transition: color 0.2s ease;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--soft-ivory) !important;
        }

        .nav-link.active::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 4px;
            width: 18px;
            height: 2px;
            border-radius: 2px;
            background: var(--scarlet-red);
            transform: translateX(-50%);
        }

        .navbar-toggler {
            border-color: var(--border-strong);
            padding: 0.4rem 0.55rem;
        }

        .navbar-toggler:focus {
            box-shadow: none;
        }

        .navbar-toggler-icon {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3e%3cpath stroke='%23F1F0EA' stroke-linecap='round' stroke-miterlimit='10' stroke-width='2' d='M4 7h22M4 15h22M4 23h22'/%3e%3c/svg%3e");
        }

        /* ---------- BUTTONS ---------- */
        .btn-primary {
            --bs-btn-color: var(--soft-ivory);
            --bs-btn-bg: var(--egyptian-blue);
            --bs-btn-border-color: var(--egyptian-blue);
            --bs-btn-hover-color: var(--soft-ivory);
            --bs-btn-hover-bg: var(--egyptian-hover);
            --bs-btn-hover-border-color: var(--egyptian-hover);
            --bs-btn-active-color: var(--soft-ivory);
            --bs-btn-active-bg: var(--egyptian-active);
            --bs-btn-active-border-color: var(--egyptian-active);
            --bs-btn-border-width: 0;
            border-radius: var(--radius-pill);
            padding: 0.8rem 1.75rem;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
        }

        .btn-outline-primary {
            --bs-btn-color: var(--stone-blue);
            --bs-btn-border-color: var(--border-strong);
            --bs-btn-hover-color: var(--midnight-navy);
            --bs-btn-hover-bg: var(--soft-ivory);
            --bs-btn-hover-border-color: var(--soft-ivory);
            --bs-btn-active-color: var(--midnight-navy);
            --bs-btn-active-bg: var(--soft-ivory);
            --bs-btn-active-border-color: var(--soft-ivory);
            border-radius: var(--radius-pill);
            padding: 0.8rem 1.75rem;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease;
        }

        .btn-outline-primary:hover {
            transform: translateY(-2px);
        }

        .btn-outline-dark {
            --bs-btn-color: var(--soft-ivory);
            --bs-btn-border-color: var(--border-strong);
            --bs-btn-hover-color: var(--midnight-navy);
            --bs-btn-hover-bg: var(--soft-ivory);
            --bs-btn-hover-border-color: var(--soft-ivory);
            --bs-btn-active-color: var(--midnight-navy);
            --bs-btn-active-bg: var(--soft-ivory);
            --bs-btn-active-border-color: var(--soft-ivory);
            border-radius: var(--radius-pill);
        }

        .btn-resume {
            background: transparent;
            border: 1.5px solid var(--border-strong);
            color: var(--soft-ivory);
            border-radius: var(--radius-pill);
            padding: 0.8rem 1.75rem;
            font-weight: 600;
            font-size: 0.95rem;
            transition: transform 0.2s ease, background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        .btn-resume:hover {
            background: var(--soft-ivory);
            border-color: var(--soft-ivory);
            color: var(--midnight-navy);
            transform: translateY(-2px);
        }

        .btn-accent {
            --bs-btn-color: var(--midnight-navy);
            --bs-btn-bg: var(--scarlet-red);
            --bs-btn-border-color: var(--scarlet-red);
            --bs-btn-hover-color: var(--midnight-navy);
            --bs-btn-hover-bg: #EE6464;
            --bs-btn-hover-border-color: #EE6464;
            --bs-btn-active-color: var(--midnight-navy);
            --bs-btn-active-bg: #D13F3F;
            --bs-btn-active-border-color: #D13F3F;
            --bs-btn-border-width: 0;
            border-radius: var(--radius-pill);
            padding: 0.85rem 1.9rem;
            font-weight: 700;
            font-size: 0.95rem;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .btn-accent:hover {
            transform: translateY(-2px);
        }

        /* ---------- SHARED SECTION STYLES ---------- */
        .section-label {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--egyptian-blue);
            margin-bottom: 0.75rem;
        }

        .section-title {
            font-weight: 800;
            letter-spacing: -0.6px;
            line-height: 1.2;
            color: var(--soft-ivory);
        }

        .section-lead {
            color: var(--stone-blue);
            font-size: 1.1rem;
            max-width: 36rem;
        }

        /* ---------- FOOTER ---------- */
        footer {
            background: var(--navy-deep);
            border-top: 1px solid var(--border);
            color: var(--stone-blue);
            padding: 3.25rem 0 2.25rem;
            margin-top: var(--space-section);
        }

        footer .footer-title {
            color: var(--soft-ivory);
            font-weight: 600;
        }

        footer a {
            color: var(--stone-blue);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: var(--soft-ivory);
        }

        footer .social-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--border);
            color: var(--stone-blue);
            transition: color 0.2s ease, border-color 0.2s ease, background-color 0.2s ease;
        }

        footer .social-link:hover {
            color: var(--soft-ivory);
            border-color: var(--stone-blue);
            background: rgba(139, 169, 197, 0.08);
        }

        /* ---------- RESPONSIVE NAV ---------- */
        @media (max-width: 991.98px) {
            .navbar {
                background-color: rgba(11, 21, 33, 0.97) !important;
                box-shadow: 0 1px 0 var(--border), 0 4px 14px rgba(4, 10, 20, 0.35);
            }

            .navbar-brand {
                font-size: 1.2rem !important;
            }

            .navbar-nav {
                padding: 0.75rem 0 0.5rem;
                text-align: center;
            }

            .navbar-nav .nav-link {
                padding: 0.65rem 0 !important;
                font-size: 1.05rem;
            }

            .navbar-nav .nav-link.active::after {
                bottom: 8px;
            }

            .navbar .btn-primary {
                width: 100%;
                margin-top: 0.75rem;
                margin-bottom: 0.5rem;
            }
        }

        @media (max-width: 575.98px) {
            .btn-primary,
            .btn-outline-primary,
            .btn-resume,
            .btn-accent {
                padding: 0.7rem 1.35rem;
                font-size: 0.9rem;
            }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>

<body>
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand" href="/">VINN <span>Wambui</span></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-lg-center">
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/projects' %}active{% endif %}" href="/projects">Projects</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.path == '/contact' %}active{% endif %}" href="/contact">Contact</a>
                    </li>
                    <li class="nav-item d-lg-none">
                        <a href="/contact" class="btn btn-primary mt-2">Connect</a>
                    </li>
                </ul>
                <a href="/contact" class="btn btn-primary ms-lg-3 d-none d-lg-inline-block">Connect</a>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container">
            <div class="row align-items-center gy-4">
                <div class="col-md-7">
                    <p class="mb-1 footer-title">Let's build something meaningful.</p>
                    <p class="mb-0 small opacity-75">© 2026 Vincent Wambugu. All rights reserved.</p>
                </div>
                <div class="col-md-5 text-md-end">
                    <div class="d-flex gap-2 justify-content-md-end justify-content-start">
                        <a href="https://github.com/VINN5" target="_blank" rel="noopener" class="social-link" aria-label="GitHub">
                            <i class="fab fa-github"></i>
                        </a>
                        <a href="mailto:vinnwambui2@gmail.com" class="social-link" aria-label="Email">
                            <i class="fas fa-envelope"></i>
                        </a>
                        <a href="https://wa.me/254759270210" target="_blank" rel="noopener" class="social-link" aria-label="WhatsApp">
                            <i class="fab fa-whatsapp"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.addEventListener('scroll', () => {
            document.querySelector('.navbar').classList.toggle('scrolled', window.scrollY > 40);
        }, { passive: true });
    </script>
    {% block extra_js %}{% endblock %}
</body>

</html>
